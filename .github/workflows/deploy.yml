name: Build and deploy FragileFit

on:
  push:
    branches: [main]
    paths:
      - "release/FragileFit-GitHub-source.zip"
      - "patches/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check source archive
        id: archive
        shell: bash
        run: |
          if [ -f "release/FragileFit-GitHub-source.zip" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Source archive not uploaded yet. Add release/FragileFit-GitHub-source.zip to publish FragileFit." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.archive.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: release/package.json

      - name: Extract source archive
        if: steps.archive.outputs.present == 'true'
        run: |
          mkdir -p site
          unzip -q release/FragileFit-GitHub-source.zip -d site

      - name: Apply TypeScript Web Crypto compatibility fix
        if: steps.archive.outputs.present == 'true'
        run: |
          if [ -f "patches/security.ts" ]; then
            cp patches/security.ts site/src/security.ts
          fi

      - name: Install dependencies
        if: steps.archive.outputs.present == 'true'
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build and test
        if: steps.archive.outputs.present == 'true'
        working-directory: site
        run: npm test

      - name: Configure GitHub Pages
        if: steps.archive.outputs.present == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.archive.outputs.present == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.archive.outputs.present == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
