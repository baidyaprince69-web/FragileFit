name: Build and deploy FragileFit
# Build v0.2.0 from the last tested base plus the verified feature patch.

on:
  push:
    branches: [main]
    paths:
      - "release/FragileFit-GitHub-source-fixed.zip"
      - "release/FragileFit-GitHub-source.zip"
      - "release/v0.2.0-patch-parts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select source archive
        id: archive
        shell: bash
        run: |
          if [ -f "release/FragileFit-GitHub-source-fixed.zip" ]; then
            echo "path=release/FragileFit-GitHub-source-fixed.zip" >> "$GITHUB_OUTPUT"
          elif [ -f "release/FragileFit-GitHub-source.zip" ]; then
            echo "path=release/FragileFit-GitHub-source.zip" >> "$GITHUB_OUTPUT"
          else
            echo "No FragileFit source ZIP found in release/." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract tested base application
        run: |
          mkdir -p site
          unzip -q "${{ steps.archive.outputs.path }}" -d site

      - name: Verify and apply v0.2.0 feature patch
        shell: bash
        run: |
          if [ -f "release/v0.2.0-patch-parts/part-00.b64" ]; then
            cat release/v0.2.0-patch-parts/part-*.b64 | base64 --decode > /tmp/FragileFit-v0.2.0-patch.zip
            unzip -tq /tmp/FragileFit-v0.2.0-patch.zip
            unzip -oq /tmp/FragileFit-v0.2.0-patch.zip -d site
            echo "FragileFit v0.2.0 feature patch verified and applied." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No v0.2.0 patch present; building tested base application." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build and test
        working-directory: site
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
