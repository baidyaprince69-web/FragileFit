name: Build and deploy FragileFit
# Build FragileFit v0.7.0: encrypted Google Drive backup and restore.

on:
  push:
    branches: [main]
    paths:
      - "release/FragileFit-GitHub-source-fixed.zip"
      - "release/FragileFit-GitHub-source.zip"
      - "release/v0.2.0-patch-parts/**"
      - "release/v0.2.1-theme/**"
      - "release/v0.3.0-polish/**"
      - "release/v0.3.1-visitor-clarity/part-*.b64"
      - "release/v0.4.0-practice/practice.html"
      - "release/v0.4.0-practice/inject-practice-links.mjs"
      - "release/v0.5.0-data-safety/**"
      - "release/v0.6.0-data-safety/**"
      - "release/v0.7.0-google-drive/**"
      - "patches/security.ts"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-v070
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select source archive
        id: archive
        shell: bash
        run: |
          if [ -f "release/FragileFit-GitHub-source-fixed.zip" ]; then
            echo "path=release/FragileFit-GitHub-source-fixed.zip" >> "$GITHUB_OUTPUT"
          elif [ -f "release/FragileFit-GitHub-source.zip" ]; then
            echo "path=release/FragileFit-GitHub-source.zip" >> "$GITHUB_OUTPUT"
          else
            echo "No FragileFit source ZIP found in release/." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract tested base application
        run: |
          mkdir -p site
          unzip -q "${{ steps.archive.outputs.path }}" -d site

      - name: Reconstruct, verify and apply v0.2.0 feature patch
        shell: bash
        run: |
          cat \
            release/v0.2.0-patch-parts/part-00.b64 \
            release/v0.2.0-patch-parts/part-01.b64 \
            release/v0.2.0-patch-parts/part-02.b64 \
            release/v0.2.0-patch-parts/part-03.b64 \
            release/v0.2.0-patch-parts/part-04fix-00.b64 \
            release/v0.2.0-patch-parts/part-04fix-01.b64 \
            release/v0.2.0-patch-parts/part-04fix-02.b64 \
            release/v0.2.0-patch-parts/part-04fix-03.b64 \
            release/v0.2.0-patch-parts/part-04fix-04.b64 \
            release/v0.2.0-patch-parts/part-04fix-05.b64 \
            release/v0.2.0-patch-parts/part-04fix-06.b64 \
            release/v0.2.0-patch-parts/part-04fix-07.b64 \
            release/v0.2.0-patch-parts/part-04fix08-00.b64 \
            release/v0.2.0-patch-parts/part-04fix08-01.b64 \
            release/v0.2.0-patch-parts/part-04fix08-02.b64 \
            release/v0.2.0-patch-parts/part-04fix08-03.b64 \
            release/v0.2.0-patch-parts/part-04fix-09.b64 \
            release/v0.2.0-patch-parts/part-05.b64 \
            release/v0.2.0-patch-parts/part-06.b64 \
            release/v0.2.0-patch-parts/part-07.b64 \
            release/v0.2.0-patch-parts/part-08a.b64 \
            release/v0.2.0-patch-parts/part-08b.b64 \
            release/v0.2.0-patch-parts/part-08c.b64 \
            release/v0.2.0-patch-parts/part-08fix-00.b64 \
            release/v0.2.0-patch-parts/part-08fix-01.b64 \
            release/v0.2.0-patch-parts/part-08fix-02a.b64 \
            release/v0.2.0-patch-parts/part-08fix-02b.b64 \
            release/v0.2.0-patch-parts/part-08fix-03.b64 \
            release/v0.2.0-patch-parts/part-08fix-04.b64 \
            release/v0.2.0-patch-parts/part-08fix-05.b64 \
            release/v0.2.0-patch-parts/part-09.b64 \
            release/v0.2.0-patch-parts/part-10.b64 \
            | base64 --decode > /tmp/FragileFit-v0.2.0-patch.zip
          unzip -tq /tmp/FragileFit-v0.2.0-patch.zip
          unzip -oq /tmp/FragileFit-v0.2.0-patch.zip -d site
          echo "Verified v0.2.0 feature patch applied." >> "$GITHUB_STEP_SUMMARY"

      - name: Reconstruct and apply v0.3.0 product polish
        shell: bash
        run: |
          cat release/v0.3.0-polish/part-{00..15}.b64 | base64 --decode > /tmp/FragileFit-v0.3.0-polish-patch.zip
          unzip -tq /tmp/FragileFit-v0.3.0-polish-patch.zip
          unzip -oq /tmp/FragileFit-v0.3.0-polish-patch.zip -d site
          echo "FragileFit v0.3.0 product and experience refresh applied." >> "$GITHUB_STEP_SUMMARY"

      - name: Reconstruct and apply v0.3.1 visitor-clarity update
        shell: bash
        run: |
          cat release/v0.3.1-visitor-clarity/part-{00..03}.b64 | base64 --decode > /tmp/FragileFit-v0.3.1-visitor-clarity.zip
          unzip -tq /tmp/FragileFit-v0.3.1-visitor-clarity.zip
          unzip -oq /tmp/FragileFit-v0.3.1-visitor-clarity.zip -d site
          echo "FragileFit v0.3.1 visitor-clarity update applied." >> "$GITHUB_STEP_SUMMARY"

      - name: Add isolated guided practice and entry links
        shell: bash
        run: |
          test -f release/v0.4.0-practice/practice.html
          test -f release/v0.4.0-practice/inject-practice-links.mjs
          node --check release/v0.4.0-practice/inject-practice-links.mjs
          cp release/v0.4.0-practice/practice.html site/practice.html
          node -e 'const fs=require("node:fs");const html=fs.readFileSync("site/practice.html","utf8");const match=html.match(/<script\b[^>]*>([\s\S]*?)<\/script>/i);if(!match)throw new Error("Practice page script is missing");fs.writeFileSync("/tmp/fragilefit-practice.js",match[1]);'
          node --check /tmp/fragilefit-practice.js
          node release/v0.4.0-practice/inject-practice-links.mjs site
          test -s site/practice.html
          grep -q "Start guided practice" site/index.html
          grep -q "Start guided practice" site/app.html
          echo "FragileFit v0.4.0 guided practice installed and linked." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply local data safety updates and tests
        shell: bash
        run: |
          test -s release/v0.5.0-data-safety/src/db.ts
          test -s release/v0.5.0-data-safety/src/main.ts
          test -s release/v0.5.0-data-safety/package.json
          test -s release/v0.5.0-data-safety/tests/run-tests.mjs
          test -s release/v0.5.0-data-safety/tests/storage-tests.mjs
          cp release/v0.5.0-data-safety/src/db.ts site/src/db.ts
          cp release/v0.5.0-data-safety/src/main.ts site/src/main.ts
          cp release/v0.5.0-data-safety/package.json site/package.json
          cp release/v0.5.0-data-safety/tests/run-tests.mjs site/tests/run-tests.mjs
          cp release/v0.5.0-data-safety/tests/storage-tests.mjs site/tests/storage-tests.mjs
          echo "Local storage protection and atomic restore source installed." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply Clear Blue visual theme
        shell: bash
        run: |
          cat release/v0.2.1-theme/clear-blue.css >> site/styles.css
          sed -i 's/<meta name="theme-color" content="[^"]*"/<meta name="theme-color" content="#f4f8ff"/g' site/*.html
          sed -i -E 's/("(theme_color|background_color)"[[:space:]]*:[[:space:]]*)"[^"]+"/\1"#f4f8ff"/g' site/manifest.webmanifest
          sed -i 's/fragilefit-shell-v2/fragilefit-shell-v3-blue/g' site/sw.js
          sed -i 's/fragilefit-shell-v3-blue/fragilefit-shell-v4-data-safety/g' site/sw.js
          echo "Clear Blue light visual theme applied." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply v0.6.0 data safety experience and Google Drive preparation
        shell: bash
        run: |
          test -s release/v0.6.0-data-safety/src/main.ts
          test -s release/v0.6.0-data-safety/src/drive.ts
          test -s release/v0.6.0-data-safety/styles.css
          test -s release/v0.6.0-data-safety/package.json
          test -s release/v0.6.0-data-safety/tests/run-tests.mjs
          test -s release/v0.6.0-data-safety/tests/data-safety-tests.mjs
          cp release/v0.6.0-data-safety/src/main.ts site/src/main.ts
          cp release/v0.6.0-data-safety/src/drive.ts site/src/drive.ts
          cp release/v0.6.0-data-safety/package.json site/package.json
          cp release/v0.6.0-data-safety/tests/run-tests.mjs site/tests/run-tests.mjs
          cp release/v0.7.0-google-drive/tests/data-safety-tests.mjs site/tests/data-safety-tests.mjs
          cat release/v0.6.0-data-safety/styles.css >> site/styles.css
          sed -i 's/fragilefit-shell-v4-data-safety/fragilefit-shell-v5-safety-warnings/g' site/sw.js
          echo "FragileFit v0.6.0 data safety warnings, guarded delete flows and Drive preparation installed." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply v0.7.0 encrypted Google Drive backup and restore
        shell: bash
        run: |
          test -s release/v0.7.0-google-drive/src/main.ts
          test -s release/v0.7.0-google-drive/src/drive.ts
          test -s release/v0.7.0-google-drive/src/google-config.ts
          test -s release/v0.7.0-google-drive/styles.css
          test -s release/v0.7.0-google-drive/package.json
          test -s release/v0.7.0-google-drive/tests/run-tests.mjs
          test -s release/v0.7.0-google-drive/tests/drive-tests.mjs
          test -s release/v0.7.0-google-drive/tests/data-safety-tests.mjs
          cp release/v0.7.0-google-drive/src/main.ts site/src/main.ts
          cp release/v0.7.0-google-drive/src/drive.ts site/src/drive.ts
          cp release/v0.7.0-google-drive/src/google-config.ts site/src/google-config.ts
          cp release/v0.7.0-google-drive/package.json site/package.json
          cp release/v0.7.0-google-drive/tests/run-tests.mjs site/tests/run-tests.mjs
          cp release/v0.7.0-google-drive/tests/drive-tests.mjs site/tests/drive-tests.mjs
          cp release/v0.7.0-google-drive/tests/data-safety-tests.mjs site/tests/data-safety-tests.mjs
          cat release/v0.7.0-google-drive/styles.css >> site/styles.css
          sed -i 's/fragilefit-shell-v5-safety-warnings/fragilefit-shell-v6-google-drive/g' site/sw.js
          echo "FragileFit v0.7.0 encrypted Google Drive backup and restore installed." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply eight-character encrypted backup password policy
        shell: bash
        run: |
          test -s patches/security.ts
          cp patches/security.ts site/src/security.ts
          echo "Eight-character minimum applied to local and Google Drive encrypted backups." >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build and test
        working-directory: site
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
