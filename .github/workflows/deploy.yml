name: Build and deploy FragileFit
# Pages source is configured to GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "release/FragileFit-GitHub-source-fixed.zip"
      - "release/FragileFit-GitHub-source.zip"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select source archive
        id: archive
        shell: bash
        run: |
          if [ -f "release/FragileFit-GitHub-source-fixed.zip" ]; then
            echo "path=release/FragileFit-GitHub-source-fixed.zip" >> "$GITHUB_OUTPUT"
          elif [ -f "release/FragileFit-GitHub-source.zip" ]; then
            echo "path=release/FragileFit-GitHub-source.zip" >> "$GITHUB_OUTPUT"
          else
            echo "No FragileFit source ZIP found in release/." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract source archive
        run: |
          mkdir -p site
          unzip -q "${{ steps.archive.outputs.path }}" -d site

      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build and test
        working-directory: site
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
