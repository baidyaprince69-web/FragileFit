name: Build and deploy FragileFit
# Build FragileFit v0.3.0: tested base, v0.2.0 features, product polish, and Clear Blue theme.

on:
  push:
    branches: [main]
    paths:
      - "release/FragileFit-GitHub-source-fixed.zip"
      - "release/FragileFit-GitHub-source.zip"
      - "release/v0.2.0-patch-parts/**"
      - "release/v0.2.1-theme/**"
      - "release/v0.3.0-polish/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-v030
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select source archive
        id: archive
        shell: bash
        run: |
          if [ -f "release/FragileFit-GitHub-source-fixed.zip" ]; then
            echo "path=release/FragileFit-GitHub-source-fixed.zip" >> "$GITHUB_OUTPUT"
          elif [ -f "release/FragileFit-GitHub-source.zip" ]; then
            echo "path=release/FragileFit-GitHub-source.zip" >> "$GITHUB_OUTPUT"
          else
            echo "No FragileFit source ZIP found in release/." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract tested base application
        run: |
          mkdir -p site
          unzip -q "${{ steps.archive.outputs.path }}" -d site

      - name: Reconstruct, verify and apply v0.2.0 feature patch
        shell: bash
        run: |
          cat \
            release/v0.2.0-patch-parts/part-00.b64 \
            release/v0.2.0-patch-parts/part-01.b64 \
            release/v0.2.0-patch-parts/part-02.b64 \
            release/v0.2.0-patch-parts/part-03.b64 \
            release/v0.2.0-patch-parts/part-04fix-00.b64 \
            release/v0.2.0-patch-parts/part-04fix-01.b64 \
            release/v0.2.0-patch-parts/part-04fix-02.b64 \
            release/v0.2.0-patch-parts/part-04fix-03.b64 \
            release/v0.2.0-patch-parts/part-04fix-04.b64 \
            release/v0.2.0-patch-parts/part-04fix-05.b64 \
            release/v0.2.0-patch-parts/part-04fix-06.b64 \
            release/v0.2.0-patch-parts/part-04fix-07.b64 \
            release/v0.2.0-patch-parts/part-04fix08-00.b64 \
            release/v0.2.0-patch-parts/part-04fix08-01.b64 \
            release/v0.2.0-patch-parts/part-04fix08-02.b64 \
            release/v0.2.0-patch-parts/part-04fix08-03.b64 \
            release/v0.2.0-patch-parts/part-04fix-09.b64 \
            release/v0.2.0-patch-parts/part-05.b64 \
            release/v0.2.0-patch-parts/part-06.b64 \
            release/v0.2.0-patch-parts/part-07.b64 \
            release/v0.2.0-patch-parts/part-08a.b64 \
            release/v0.2.0-patch-parts/part-08b.b64 \
            release/v0.2.0-patch-parts/part-08c.b64 \
            release/v0.2.0-patch-parts/part-08fix-00.b64 \
            release/v0.2.0-patch-parts/part-08fix-01.b64 \
            release/v0.2.0-patch-parts/part-08fix-02a.b64 \
            release/v0.2.0-patch-parts/part-08fix-02b.b64 \
            release/v0.2.0-patch-parts/part-08fix-03.b64 \
            release/v0.2.0-patch-parts/part-08fix-04.b64 \
            release/v0.2.0-patch-parts/part-08fix-05.b64 \
            release/v0.2.0-patch-parts/part-09.b64 \
            release/v0.2.0-patch-parts/part-10.b64 \
            | base64 --decode > /tmp/FragileFit-v0.2.0-patch.zip
          unzip -tq /tmp/FragileFit-v0.2.0-patch.zip
          unzip -oq /tmp/FragileFit-v0.2.0-patch.zip -d site
          echo "Verified v0.2.0 feature patch applied." >> "$GITHUB_STEP_SUMMARY"

      - name: Reconstruct and apply v0.3.0 product polish
        shell: bash
        run: |
          cat \\
            release/v0.3.0-polish/part-00.b64 \\
            release/v0.3.0-polish/part-01.b64 \\
            release/v0.3.0-polish/part-02.b64 \\
            release/v0.3.0-polish/part-03.b64 \\
            release/v0.3.0-polish/part-04.b64 \\
            release/v0.3.0-polish/part-05.b64 \\
            release/v0.3.0-polish/part-06.b64 \\
            release/v0.3.0-polish/part-07.b64 \\
            release/v0.3.0-polish/part-08.b64 \\
            release/v0.3.0-polish/part-09.b64 \\
            release/v0.3.0-polish/part-10.b64 \\
            release/v0.3.0-polish/part-11.b64 \\
            release/v0.3.0-polish/part-12.b64 \\
            release/v0.3.0-polish/part-13.b64 \\
            release/v0.3.0-polish/part-14.b64 \\
            release/v0.3.0-polish/part-15.b64
            | base64 --decode > /tmp/FragileFit-v0.3.0-polish-patch.zip
          unzip -tq /tmp/FragileFit-v0.3.0-polish-patch.zip
          unzip -oq /tmp/FragileFit-v0.3.0-polish-patch.zip -d site
          echo "FragileFit v0.3.0 product and experience refresh applied." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply Clear Blue visual theme
        shell: bash
        run: |
          cat release/v0.2.1-theme/clear-blue.css >> site/styles.css
          sed -i 's/<meta name="theme-color" content="[^"]*"/<meta name="theme-color" content="#f4f8ff"/g' site/*.html
          sed -i -E 's/("(theme_color|background_color)"[[:space:]]*:[[:space:]]*)"[^"]+"/\\1"#f4f8ff"/g' site/manifest.webmanifest
          sed -i 's/fragilefit-shell-v2/fragilefit-shell-v3-blue/g' site/sw.js
          echo "Clear Blue light visual theme applied." >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build and test
        working-directory: site
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
